<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generatore Preventivi</title>
    <!-- Collegamento al Manifest per l'installazione -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0f172a">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8fafc;
            color: #334155;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        hh1 { color: #0f172a; font-size: 1.5rem; }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Generatore Preventivi</h1>
        
        <div class="form-group">
            <label for="nomeDitta">Nome della tua ditta:</label>
            <input type="text" id="nomeDitta" placeholder="Inserisci il nome qui...">
        </div>
        
        <!-- Qui puoi aggiungere il resto del tuo modulo per i preventivi -->
    </div>

    <script>
        // 1. Registrazione del Service Worker per la PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registrato con successo:', reg.scope))
                    .catch(err => console.log('Errore registrazione Service Worker:', err));
            });
        }

        // 2. Gestione del salvataggio automatico del nome ditta
        const inputDitta = document.getElementById('nomeDitta');

        // Al caricamento, controlla se c'è un valore salvato in precedenza
        window.addEventListener('DOMContentLoaded', () => {
            const dittaSalvata = localStorage.getItem('nomeDittaPreventivi');
            if (dittaSalvata) {
                inputDitta.value = dittaSalvata;
            }
        });

        // Ogni volta che scrivi qualcosa, salvalo subito nella memoria del browser
        inputDitta.addEventListener('input', () => {
            localStorage.setItem('nomeDittaPreventivi', inputDitta.value);
        });
    </script>
</body>
</html>
